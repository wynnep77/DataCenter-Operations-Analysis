# Callan Operational Dashboard v2 - one Docker host with an NVIDIA GPU (8-12 GB VRAM).
# Prerequisites: Docker Engine + Compose v2, NVIDIA driver, NVIDIA Container Toolkit.
# Start:  cp .env.example .env   (set ADMIN_TOKEN)   then   docker compose up -d --build
name: callan-dashboard

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama-models:/root/.ollama
    # Not published: only the API talks to Ollama. Uncomment for local debugging.
    # ports: ["127.0.0.1:11434:11434"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot job: pulls the default model (and any extra models) into the shared volume. Safe to re-run.
  ollama-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_EXTRA_MODELS: ${OLLAMA_EXTRA_MODELS:-}
    volumes:
      - ./scripts/pull-models.sh:/pull-models.sh:ro
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    restart: "no"

  api:
    build: ./api
    image: ${REGISTRY:-callan}/dcoa-api:${TAG:-2.0.0-dev}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-qwen3:8b,qwen3:14b,qwen3:4b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-12288}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-600}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env (use a long random value)}
      MAX_CONCURRENT_CHATS: ${MAX_CONCURRENT_CHATS:-2}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-12}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-30000}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build: ./web
    image: ${REGISTRY:-callan}/dcoa-web:${TAG:-2.0.0-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  ollama-models:
